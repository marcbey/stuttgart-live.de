---
- name: PostgreSQL-Pakete installieren
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present
    update_cache: true

- name: PostgreSQL-Dienst aktivieren
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: PostgreSQL-Konfiguration ermitteln
  ansible.builtin.shell: |
    set -euo pipefail
    sudo -u postgres psql -tAc "show config_file;"
  args:
    executable: /bin/bash
  register: postgres_config_file
  changed_when: false

- name: PostgreSQL-HBA-Konfiguration ermitteln
  ansible.builtin.shell: |
    set -euo pipefail
    sudo -u postgres psql -tAc "show hba_file;"
  args:
    executable: /bin/bash
  register: postgres_hba_file
  changed_when: false

- name: PostgreSQL auf Host- und Docker-Netze lauschen lassen
  ansible.builtin.lineinfile:
    path: "{{ postgres_config_file.stdout | trim }}"
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = '{{ postgres_listen_addresses }}'"
    state: present
  notify: restart postgresql

- name: PostgreSQL-Zugriff für definierte Regeln erlauben
  community.postgresql.postgresql_pg_hba:
    dest: "{{ postgres_hba_file.stdout | trim }}"
    contype: host
    databases: "{{ item.databases }}"
    users: "{{ item.users }}"
    source: "{{ item.source }}"
    method: "{{ item.method | default('scram-sha-256') }}"
    create: true
  loop: "{{ postgres_host_access_rules }}"
  notify: restart postgresql

- name: Veraltete PostgreSQL-Zugriffsregeln entfernen
  community.postgresql.postgresql_pg_hba:
    dest: "{{ postgres_hba_file.stdout | trim }}"
    contype: host
    databases: "{{ item.databases }}"
    users: "{{ item.users }}"
    source: "{{ item.source }}"
    method: "{{ item.method | default('scram-sha-256') }}"
    state: absent
    create: true
  loop: "{{ postgres_legacy_host_access_rules | default([]) }}"
  notify: restart postgresql

- name: Sicherstellen, dass ein Datenbank-Passwort gesetzt ist
  ansible.builtin.assert:
    that:
      - postgres_app_password | length > 0
    fail_msg: "Setze postgres_app_password vor dem PostgreSQL-Setup."

- name: Applikationsrolle in PostgreSQL anlegen
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ postgres_app_user }}"
    password: "{{ postgres_app_password }}"
    role_attr_flags: LOGIN
    state: present
  no_log: true

- name: Applikationsdatenbanken anlegen
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ item }}"
    owner: "{{ postgres_app_user }}"
    state: present
  loop: "{{ postgres_app_databases }}"

- name: Russ-Live-PostgreSQL-Passwörter gemeinsam validieren
  ansible.builtin.assert:
    that:
      - postgres_russ_live_readonly_password | length > 0
      - postgres_russ_live_operational_password | length > 0
    fail_msg: "Setze postgres_russ_live_readonly_password und postgres_russ_live_operational_password gemeinsam."
  when: >
    (postgres_russ_live_readonly_password | length > 0) or
    (postgres_russ_live_operational_password | length > 0)

- name: Russ-Live-Operational-Rolle in PostgreSQL anlegen
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ postgres_russ_live_operational_user }}"
    password: "{{ postgres_russ_live_operational_password }}"
    role_attr_flags: LOGIN
    state: present
  no_log: true
  when: postgres_russ_live_operational_password | length > 0

- name: Russ-Live-Operational-Datenbanken anlegen
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ item }}"
    owner: "{{ postgres_russ_live_operational_user }}"
    state: present
  loop: "{{ postgres_russ_live_operational_databases }}"
  when: postgres_russ_live_operational_password | length > 0

- name: Russ-Live-Read-only-Rolle in PostgreSQL anlegen
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ postgres_russ_live_readonly_user }}"
    password: "{{ postgres_russ_live_readonly_password }}"
    role_attr_flags: LOGIN
    state: present
  no_log: true
  when: postgres_russ_live_readonly_password | length > 0

- name: Russ-Live-Read-only-Datenbankzugriff erlauben
  become_user: postgres
  community.postgresql.postgresql_privs:
    database: "{{ item }}"
    type: database
    objs: "{{ item }}"
    roles: "{{ postgres_russ_live_readonly_user }}"
    privs: CONNECT
    state: present
  loop: "{{ postgres_russ_live_readonly_databases }}"
  when: postgres_russ_live_readonly_password | length > 0

- name: Russ-Live-Read-only-Schemazugriff erlauben
  become_user: postgres
  community.postgresql.postgresql_privs:
    database: "{{ item }}"
    type: schema
    objs: public
    roles: "{{ postgres_russ_live_readonly_user }}"
    privs: USAGE
    state: present
  loop: "{{ postgres_russ_live_readonly_databases }}"
  when: postgres_russ_live_readonly_password | length > 0

- name: Russ-Live-Read-only-Tabellenzugriff erlauben
  become_user: postgres
  community.postgresql.postgresql_privs:
    database: "{{ item }}"
    type: table
    schema: public
    objs: ALL_IN_SCHEMA
    roles: "{{ postgres_russ_live_readonly_user }}"
    privs: SELECT
    state: present
  loop: "{{ postgres_russ_live_readonly_databases }}"
  when: postgres_russ_live_readonly_password | length > 0

- name: Russ-Live-Read-only-Sequenzzugriff erlauben
  become_user: postgres
  community.postgresql.postgresql_privs:
    database: "{{ item }}"
    type: sequence
    schema: public
    objs: ALL_IN_SCHEMA
    roles: "{{ postgres_russ_live_readonly_user }}"
    privs: SELECT,USAGE
    state: present
  loop: "{{ postgres_russ_live_readonly_databases }}"
  when: postgres_russ_live_readonly_password | length > 0

- name: Russ-Live-Read-only-Default-Tabellenrechte setzen
  become_user: postgres
  community.postgresql.postgresql_privs:
    database: "{{ item }}"
    type: default_privs
    schema: public
    objs: TABLES
    target_roles: "{{ postgres_app_user }}"
    roles: "{{ postgres_russ_live_readonly_user }}"
    privs: SELECT
    state: present
  loop: "{{ postgres_russ_live_readonly_databases }}"
  when: postgres_russ_live_readonly_password | length > 0

- name: Russ-Live-Read-only-Default-Sequenzrechte setzen
  become_user: postgres
  community.postgresql.postgresql_privs:
    database: "{{ item }}"
    type: default_privs
    schema: public
    objs: SEQUENCES
    target_roles: "{{ postgres_app_user }}"
    roles: "{{ postgres_russ_live_readonly_user }}"
    privs: SELECT,USAGE
    state: present
  loop: "{{ postgres_russ_live_readonly_databases }}"
  when: postgres_russ_live_readonly_password | length > 0
