<%
require File.expand_path("app/lib/hetzner_deploy_config.rb", Dir.pwd)
%>

# Hetzner production target for Kamal.
# Usage: bin/kamal deploy -d hetzner

deploy_timeout: 90

servers:
  web:
    hosts:
      - <%= HetznerDeployConfig.web_host %>
    env:
      clear:
        WEB_CONCURRENCY: 2
        RAILS_MAX_THREADS: 3
        DB_POOL: 3
        QUEUE_DB_POOL: 3
  job:
    hosts:
      - <%= HetznerDeployConfig.web_host %>
    cmd: bin/jobs
    env:
      clear:
        JOB_CONCURRENCY: 1
        JOB_THREADS: 3
        DB_POOL: 3
        QUEUE_DB_POOL: 5

proxy:
<% if HetznerDeployConfig.production_preissued_tls? %>
  ssl:
    certificate_pem: SSL_CERTIFICATE_PEM
    private_key_pem: SSL_PRIVATE_KEY_PEM
<% else %>
  ssl: true
<% end %>
<% if HetznerDeployConfig.production_domain_mode == "legacy" %>
  host: <%= HetznerDeployConfig.app_host %>
<% else %>
  hosts: <%= HetznerDeployConfig.production_hosts.to_json %>
<% end %>
  app_port: 80

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "marcbey") %>
  password:
    - KAMAL_REGISTRY_PUSH_TOKEN

env:
  secret:
    - RAILS_MASTER_KEY
    - DB_PASSWORD
    - MEDIA_PROXY_SECRET
  clear:
    APP_ENVIRONMENT: production
    APP_ALLOWED_HOSTS: <%= HetznerDeployConfig.production_hosts.join(",") %>
    CANONICAL_REDIRECT_ENABLED: "<%= HetznerDeployConfig.production_redirect? %>"
    STORAGE_VOLUME: stuttgart_live_de_storage
    APP_HOST: <%= HetznerDeployConfig.app_host %>
    SENTRY_ENVIRONMENT: production
    SENTRY_RELEASE: <%= ENV.fetch("SENTRY_RELEASE") { `git rev-parse HEAD`.strip } %>
    DB_HOST: 172.18.0.1
    DB_PORT: 5432
    DB_NAME: <%= ENV.fetch("DB_NAME", "stuttgart_live_de_production") %>
    DB_USER: <%= ENV.fetch("DB_USER", "stuttgart_live_de") %>
    ACTIVE_STORAGE_SERVICE: <%= ENV.fetch("ACTIVE_STORAGE_SERVICE", "local") %>
    MEDIA_PROXY_ENABLED: <%= ENV.fetch("MEDIA_PROXY_ENABLED", "true") %>
    STAGING_NOINDEX: "<%= !HetznerDeployConfig.production_redirect? %>"

ssh:
  user: deploy
  keys:
    - <%= ENV.fetch("KAMAL_SSH_KEY_PATH", File.expand_path("~/.ssh/stgt-live-hetzner-github")) %>

volumes:
  - "stuttgart_live_de_storage:/rails/storage"
