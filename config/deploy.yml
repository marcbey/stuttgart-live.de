# Gemeinsame Kamal-Basiskonfiguration.
# Der produktive Zielpfad wird über `-d hetzner` geladen.

require_destination: true

service: stuttgart_live_de
image: <%= ENV.fetch("KAMAL_IMAGE", "marcbey/stuttgart-live-de") %>

labels:
  live.release_digest: <%= ENV.fetch("RELEASE_DIGEST", "").inspect %>

# Project container output through the host log filter before writing to the journal.
logging:
  driver: syslog
  options:
    syslog-address: unixgram:///run/website-log-filter.sock
    syslog-format: rfc5424micro
    tag: "{{.Name}}"
    cache-disabled: "true"
    mode: non-blocking

# Both repositories and both destinations manage the same proxy container.
proxy:
  run:
    log_max_size: ""
    options:
      log-driver: syslog
      log-opt:
        - syslog-address=unixgram:///run/website-log-filter.sock
        - syslog-format=rfc5424micro
        - tag={{.Name}}
        - cache-disabled=true
        - mode=non-blocking

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

asset_path: /rails/public/assets

builder:
  context: .
  arch: amd64
